name: Build Kubuntu 24.04 container for Tiny Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'build.sh'
      - 'assemble.sh'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap zstd
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml || sudo -H python3 -m pip install --break-system-packages pyyaml

      - name: Set up QEMU (arm64 binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Show binfmt registration
        run: |
          cat /proc/sys/fs/binfmt_misc/status || true
          ls /proc/sys/fs/binfmt_misc/ || true
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 || true

      - name: Bootstrap Ubuntu 24.04 (noble) arm64 rootfs
        run: |
          set -o pipefail
          set -x
          sudo debootstrap --arch=arm64 --variant=minbase --foreign noble rootfs http://ports.ubuntu.com/ubuntu-ports/ 2>&1 | tee bootstrap.log
          # setup-qemu-action 注册的 binfmt 带 F 标志（解释器由内核持有），chroot 内可直接执行 arm64 程序，无需拷贝 qemu
          BINFMT=/proc/sys/fs/binfmt_misc/qemu-aarch64
          cat "$BINFMT" || true
          if ! grep -q 'flags:.*F' "$BINFMT"; then
            echo "ERROR: binfmt entry for qemu-aarch64 missing F flag; refusing to continue" >&2
            exit 1
          fi
          echo "binfmt F flag present; running second-stage directly"
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /debootstrap/debootstrap --second-stage 2>&1 | tee -a bootstrap.log
        # 步骤内已 tee 日志；失败时由下面步骤上传

      - name: Upload bootstrap log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-log
          path: bootstrap.log
          if-no-files-found: ignore

      - name: Install Kubuntu packages (qemu emulation, may take 1-2 hours)
        run: |
          set -euxo pipefail
          sudo mount -t proc proc rootfs/proc
          sudo mount --bind /dev rootfs/dev
          sudo cp build.sh rootfs/build.sh
          sudo chroot rootfs /bin/bash /build.sh 2>&1 | tee install.log
          sudo rm -f rootfs/build.sh
          sudo umount rootfs/dev || true
          sudo umount rootfs/proc || true
          df -h /

      - name: Upload install log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: install.log
          if-no-files-found: ignore

      - name: Assemble tiny.yaml + helper files and package
        run: |
          set -euxo pipefail
          chmod +x assemble.sh
          bash assemble.sh 2>&1 | tee assemble.log

      - name: Upload assemble log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: assemble.log
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kubuntu-zh-${{ github.run_number }}
          name: Kubuntu 24.04 容器镜像（第 ${{ github.run_number }} 次构建）
          body: |
            ## 使用方法
            1. 下载下方 `kubuntu-zh-*.tar.zst`（若为分卷 `*.part-00 / *.part-01`，先合并：`cat kubuntu-zh-*.tar.zst.part-* > kubuntu-zh.tar.zst`）
            2. 打开小小容器（Tiny Container），在主界面点击 **导入** 按钮，选择该文件
            3. 等待导入完成，进入「功能」页，启用 **X11 (Termux:X11)** 或 **AVNC (VNC)** 前端
            4. 重启容器即可进入 KDE Plasma 桌面

            ## 默认账户
            - 用户 `tiny` / 密码 `tiny`（免密 sudo）
            - root 密码 `tiny`

            ## 说明
            - 基于 Ubuntu 24.04 LTS (noble) arm64 + kde-plasma-desktop
            - 图形会话：Plasma X11（startplasma-x11）
            - /opt/tiny 辅助文件、pipewire 配置复用自官方 xfce-zh 容器
          files: kubuntu-zh-*
          make_latest: true
